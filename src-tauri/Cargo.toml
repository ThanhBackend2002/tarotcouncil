[package]
name = "tarotcouncil"
version = "0.1.0"
description = "TarotCouncil — hội đồng thầy bói AI đọc bài tarot"
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` suffix tránh xung đột tên giữa lib và bin trên Windows (cargo issue #8519)
name = "tarotcouncil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"                       # CancellationToken
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# KHÔNG dùng native-tls/OpenSSL. `rustls-tls` = webpki roots (bundled),
# `rustls-tls-native-roots` = đọc thêm cert store của OS (Windows/Linux) — cần cho
# proxy doanh nghiệp có custom CA, vẫn không kéo OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
    "stream",
    "http2",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

unicode-normalization = "0.1"
# Index tìm kiếm (rebuild được) cho Nhật ký. `bundled` = tự build SQLite, có sẵn FTS5.
rusqlite = { version = "0.37", features = ["bundled"] }

# Tráo bài tái lập được từ seed (plan §2 draw.rs): ChaCha20 + seed 32 byte từ OS.
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

# Keyring của hệ điều hành (secrets.rs). keyring v3 KHÔNG bật feature = mock không lưu gì
# → bật backend thật theo từng OS. Linux/BSD: Secret Service qua zbus (thuần Rust, không cần
# libdbus-dev / openssl headers khi build trên Linux/WSL), runtime async-io, mã hoá crypto-rust.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "=3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
